name: Veracode Security Scan

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "Verademo-Test"

    steps:
    # ------------------------------------------------------------
    # Checkout code
    # ------------------------------------------------------------
    - name: Checkout source
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # Setup Java (required for pipeline scan only)
    # ------------------------------------------------------------
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # ------------------------------------------------------------
    # Build application (example)
    # ------------------------------------------------------------
    - name: Build application
      run: |
        zip -r app.zip . -x ".git/*"

    # ------------------------------------------------------------
    # Install Veracode CLI v2
    # ------------------------------------------------------------
    - name: Install Veracode CLI
      run: |
        curl -fsS https://tools.veracode.com/veracode-cli/install | sh
        echo "$PWD" >> $GITHUB_PATH
        veracode version


    # ------------------------------------------------------------
    # PIPELINE SCAN (FAST, NO POLICY GATE)
    # ------------------------------------------------------------
    - name: Run Veracode Pipeline Scan
      env:
        VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
        VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      run: |
        curl -fL https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip -o pipeline-scan.zip
        unzip -o pipeline-scan.zip -d veracode-pipeline

        java -jar veracode-pipeline/pipeline-scan.jar \
          --vid $VERACODE_API_ID \
          --vkey $VERACODE_API_KEY \
          --file app.zip \
          --json_output pipeline-results.json \
          --summary_output pipeline-summary.txt \
          --fail_on_severity none

    # ------------------------------------------------------------
    # Upload Pipeline Scan artifacts
    # ------------------------------------------------------------
    - name: Upload Pipeline Scan Results
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-scan-results
        path: |
          pipeline-results.json
          pipeline-summary.txt

    # ------------------------------------------------------------
    # POLICY SCAN (UPLOAD & START)
    # ------------------------------------------------------------
    - name: Upload for Policy Scan
      env:
        VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
        VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      run: |
        veracode static scan upload \
          --app-name "$APP_NAME" \
          --create-profile true \
          --file app.zip

    # ------------------------------------------------------------
    # WAIT FOR POLICY SCAN COMPLETION
    # ------------------------------------------------------------
    - name: Wait for Policy Scan
      env:
        VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
        VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      run: |
        veracode static scan wait \
          --app-name "$APP_NAME"

    # ------------------------------------------------------------
    # DOWNLOAD POLICY SCAN PDF
    # ------------------------------------------------------------
    - name: Download Policy Scan PDF
      env:
        VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
        VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      run: |
        veracode static report download \
          --app-name "$APP_NAME" \
          --format pdf \
          --output Verademo-Policy-Scan.pdf

    # ------------------------------------------------------------
    # Upload Policy Scan PDF
    # ------------------------------------------------------------
    - name: Upload Policy Scan PDF
      uses: actions/upload-artifact@v4
      with:
        name: veracode-policy-scan-pdf
        path: Verademo-Policy-Scan.pdf
