name: Veracode Pipeline Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) (Optional) Build your artifact
      # Uncomment and update if your project needs building
      # - name: Build app
      #   run: |
      #     mvn -B package --file pom.xml
      #   # or your build command

      - name: Package code
        run: zip -r artifact.zip . -x "*.git*"

      - name: Download Veracode CLI
        run: |
          curl -L -O https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip pipeline-scan-LATEST.zip -d veracode-cli
      
      - name: Generate PDF report
        run: |
          java -jar veracode-cli/pipeline-scan.jar \
            --app_id "${{ secrets.APP_NAME }}" \
            --sandbox_name "${{ secrets.SANDBOX_NAME }}" \
            --action getreport \
            --reportformat pdf \
            --reportname veracode_scan_report.pdf \
            --vid "${{ secrets.VERACODE_API_ID }}" \
            --vkey "${{ secrets.VERACODE_API_KEY }}"
      
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: veracode_pdf_report
          path: veracode-cli/veracode_scan_report.pdf
