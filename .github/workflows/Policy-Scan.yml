name: Veracode Scan Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest
    steps:

      # 6️⃣ Download classic Veracode CLI for PDF report
      - name: Download Veracode CLI (classic)
        run: |
          curl -fsS -L https://downloads.veracode.com/securityscan/veracode.jar -o veracode.jar
          chmod +x veracode.jar

      # 7️⃣ Generate PDF report
      - name: Generate PDF report
        run: |
          java -jar veracode.jar \
            -appid "${{ secrets.VERACODE_API_ID_VAL }}" \
            -sandboxname "${{ secrets.SANDBOX_NAME }}" \
            -action getreport \
            -reportformat pdf \
            -reportname veracode_scan_report.pdf \
            -vid "${{ secrets.VERACODE_API_ID }}" \
            -vkey "${{ secrets.VERACODE_API_KEY }}"

      # 8️⃣ Upload PDF artifact
      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: veracode_pdf_report
          path: veracode_scan_report.pdf
