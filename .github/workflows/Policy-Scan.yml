name: Veracode Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 3.1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 3.2: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Step 3.3: Download Veracode CLI
      - name: Download Veracode CLI
        run: |
          curl -L -o veracode.jar https://downloads.veracode.com/securityscan/pipeline/veracode-cli-LATEST-all.jar

      # Step 3.4: Run Veracode scan
      - name: Run Veracode Scan
        run: |
          java -jar veracode.jar \
            -appid "${{ secrets.APP_NAME }}" \
            -sandboxname "${{ secrets.SANDBOX_NAME }}" \
            -action uploadandscan \
            -createprofile false \
            -version "1.0.0" \
            -auto \
            -filepath "./" \
            -vid "${{ secrets.VERACODE_API_ID }}" \
            -vkey "${{ secrets.VERACODE_API_KEY }}"

      # Step 3.5: Download PDF report
      - name: Download PDF report
        run: |
          java -jar veracode.jar \
            -appid "${{ secrets.APP_NAME }}" \
            -sandboxname "${{ secrets.SANDBOX_NAME }}" \
            -action getreport \
            -reportformat pdf \
            -vid "${{ secrets.VERACODE_API_ID }}" \
            -vkey "${{ secrets.VERACODE_API_KEY }}" \
            -reportname "veracode_scan_report.pdf"

      # Step 3.6: Upload PDF as artifact
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v3
        with:
          name: veracode-pdf-report
          path: veracode_scan_report.pdf
