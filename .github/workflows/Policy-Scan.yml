name: Veracode Pipeline Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) (Optional) Build your artifact
      # Uncomment and update if your project needs building
      # - name: Build app
      #   run: |
      #     mvn -B package --file pom.xml
      #   # or your build command

      # 3) Run Veracode Pipeline Scan
      - name: Run Veracode pipeline scan
        uses: veracode/Veracode-pipeline-scan-action@v1.0.12
        id: pipeline-scan
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          file: "./"                 # path to output artifact or source
          # Optional:
          # veracode_policy_name: "MyPolicy"
          # fail_on_severity: "Very High, High"

      # Download Veracode CLI
      - name: Download Veracode CLI
        run: |
          curl -L -o veracode-cli.jar https://downloads.veracode.com/securityscan/pipeline/veracode-cli-LATEST-all.jar

      # Get PDF detailed report
      - name: Download PDF report
        run: |
          java -jar veracode-cli.jar \
            -appid "${{ secrets.APP_NAME }}" \
            -sandboxname "${{ secrets.SANDBOX_NAME }}" \
            -action getreport \
            -reportformat pdf \
            -reportname "veracode_scan_report.pdf" \
            -vid "${{ secrets.VERACODE_API_ID }}" \
            -vkey "${{ secrets.VERACODE_API_KEY }}"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: veracode_pdf_report
          path: veracode_scan_report.pdf
