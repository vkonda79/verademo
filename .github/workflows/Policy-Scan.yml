name: Veracode Pipeline Scan & Policy Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  veracode_scan:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Step 1: Checkout repository
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ------------------------------------------------------------
      # Step 2: Set up Java (required for Veracode CLI)
      # ------------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------
      # Step 3: Install Veracode CLI v2
      # ------------------------------------------------------------
      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          chmod +x veracode
          echo "$PWD" >> $GITHUB_PATH
          veracode version

      # ------------------------------------------------------------
      # Step 4: Prepare artifact (zip your project)
      # ------------------------------------------------------------
      - name: Prepare Artifact
        run: zip -r app.zip .

      # ------------------------------------------------------------
      # Step 5: Run Veracode Pipeline Scan (all severities)
      # ------------------------------------------------------------
      - name: Run Pipeline Scan
        run: |
          ./veracode pipeline-scan \
            -vid ${{ secrets.VERACODE_API_ID }} \
            -vkey ${{ secrets.VERACODE_API_KEY }} \
            -appname "Verademo-Test" \
            -stage Testing \
            -file app.zip \
            -fail-on-severity low \
            -json-report Verademo-Scan-Report.json \
            -summary-report Verademo-Scan-Summary.txt \
            -filtered-json-report filtered_results.json

      # ------------------------------------------------------------
      # Step 6: Optional - Policy Scan (PDF report)
      # ------------------------------------------------------------
      - name: Run Policy Scan & Download PDF
        run: |
          ./veracode policy-scan \
            -vid ${{ secrets.VERACODE_API_ID }} \
            -vkey ${{ secrets.VERACODE_API_KEY }} \
            -appname "Verademo-Test" \
            -file app.zip \
            -createprofile true \
            -autoscan true \
            -pdf-report Verademo-Policy-Report.pdf

      # ------------------------------------------------------------
      # Step 7: Upload JSON report
      # ------------------------------------------------------------
      - name: Upload JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: veracode-json-report
          path: Verademo-Scan-Report.json

      # ------------------------------------------------------------
      # Step 8: Upload Summary report
      # ------------------------------------------------------------
      - name: Upload Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: veracode-summary-report
          path: Verademo-Scan-Summary.txt

      # ------------------------------------------------------------
      # Step 9: Upload Filtered JSON report
      # ------------------------------------------------------------
      - name: Upload Filtered JSON
        uses: actions/upload-artifact@v4
        with:
          name: veracode-filtered-report
          path: filtered_results.json

      # ------------------------------------------------------------
      # Step 10: Upload Policy Scan PDF
      # ------------------------------------------------------------
      - name: Upload Policy Scan PDF
        uses: actions/upload-artifact@v4
        with:
          name: veracode-policy-pdf
          path: Verademo-Policy-Report.pdf
