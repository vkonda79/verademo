name: Veracode Pipeline Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) (Optional) Build your artifact
      # Uncomment and update if your project needs building
      # - name: Build app
      #   run: |
      #     mvn -B package --file pom.xml
      #   # or your build command

      - name: Package code
        run: zip -r artifact.zip . -x "*.git*"

      - name: Download Veracode CLI
        run: |
          curl -O https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip pipeline-scan-LATEST.zip -d veracode-cli
          ls veracode-cli
          # veracode.jar  other files...

          #chmod +x veracode-cli.jar
      
      - name: Run Veracode CLI to get PDF
        run: |
          java -jar pipeline-scan.jar \
            -appid "${{ secrets.APP_NAME }}" \
            -sandboxname "${{ secrets.SANDBOX_NAME }}" \
            -action getreport \
            -reportformat pdf \
            -reportname veracode_scan_report.pdf \
            -vid "${{ secrets.VERACODE_API_ID }}" \
            -vkey "${{ secrets.VERACODE_API_KEY }}"
