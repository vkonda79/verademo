name: Veracode Pipeline Scan CLI v2

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh -s -- -b $HOME/veracode-cli
          echo "$HOME/veracode-cli" >> $GITHUB_PATH

      - name: Veracode Static Analysis (SAST)
        run: |
          # 1. Create the .veracode directory in the runner's home folder
          mkdir -p $HOME/.veracode
          
          # 2. Create the credentials file with the expected format
          # Note: Use printf to avoid issues with special characters in keys
          printf "[default]\nveracode_api_key_id = %s\nveracode_api_key_secret = %s\n" \
            "${{ secrets.VERACODE_API_ID }}" \
            "${{ secrets.VERACODE_API_KEY }}" > $HOME/.veracode/credentials
          
          # 3. Run the scan
          ./veracode static scan . --results-file results.json
          
      - name: Veracode Software Composition Analysis (SCA)
        run: |
          # Scans for vulnerable open-source dependencies
          veracode sca scan .
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_SECRET }}
