name: Veracode Pipeline Scan CLI v2

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh -s -- -b $HOME/veracode-cli
          echo "$HOME/veracode-cli" >> $GITHUB_PATH

      - name: Veracode Static Analysis (SAST)
        run: |
          # 1. Set credentials
          export VERACODE_API_KEY_ID="${{ secrets.VERACODE_API_ID }}"
          export VERACODE_API_KEY_SECRET="${{ secrets.VERACODE_API_KEY }}"
          
          # 2. Package the current directory
          # This creates a veracode-package.zip by default
          ./veracode package --source . --output veracode-artifacts --trust
          
          # 3. Scan the generated artifact
          # We point the scan at the directory created by the package command
          ./veracode static scan veracode-artifacts/ --results-file results.json
          
      - name: Veracode Software Composition Analysis (SCA)
        run: |
          # Scans for vulnerable open-source dependencies
          veracode sca scan .
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_SECRET }}
