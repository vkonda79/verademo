name: Veracode Pipeline Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) (Optional) Build your artifact
      # Uncomment and update if your project needs building
      # - name: Build app
      #   run: |
      #     mvn -B package --file pom.xml
      #   # or your build command

      - name: Package code
        run: zip -r artifact.zip . -x "*.git*"

      # 3) Run Veracode Pipeline Scan
      - name: Run Veracode pipeline scan
        uses: veracode/Veracode-pipeline-scan-action@v1.0.12
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          file: artifact.zip
          json_output_file: results.json
          summary_output_file: summary.txt
          token: ${{ secrets.VERACODE_API_TOKEN }}
      
      # ✅ Manually upload JSON results as GitHub artifacts
      - name: Upload Veracode JSON results
        uses: actions/upload-artifact@v4
        with:
          name: veracode_json_results
          path: |
            results.json
            filtered_results.json
      
      # Optional: Upload summary
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: veracode_summary
          path: summary.txt
