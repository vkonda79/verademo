name: Veracode Scan with PDF Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Run Veracode Scan via official action
      - name: Run Veracode Scan
        uses: veracode/veracode-scan-action@v1
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          app_name: ${{ secrets.APP_NAME }}
          sandbox_name: ${{ secrets.SANDBOX_NAME }}
          create_profile: false
          version: ${{ github.sha }}
          wait_for_scan: true
          scan_file: "./"   # path to the code or ZIP

      # Step 3: Download PDF report
      - name: Download PDF report
        run: |
          curl -u "${{ secrets.VERACODE_API_ID }}:${{ secrets.VERACODE_API_KEY }}" \
               -X GET \
               "https://analysiscenter.veracode.com/api/5.0/detailedreport.do?app_id=$(veracode-cli get-app-id --app_name ${{ secrets.APP_NAME }})&sandbox_name=${{ secrets.SANDBOX_NAME }}&report_format=pdf" \
               -o veracode_scan_report.pdf || echo "PDF download may require CLI; see note below."

      # Step 4: Upload PDF as artifact
      - name: Upload PDF report
        uses: actions/upload-artifact@v3
        with:
          name: veracode-pdf-report
          path: veracode_scan_report.pdf
