name: Veracode Pipeline Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  veracode_scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Java (required for Veracode CLI)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Step 3: Install Veracode Pipeline Scan CLI
      - name: Install Veracode CLI
        run: |
          curl -L https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip -o pipeline-scan.zip
          unzip pipeline-scan.zip -d veracode-cli

      # Step 4: Prepare artifact (zip your project)
      - name: Prepare Artifact
        run: zip -r app.zip .

      # Step 5: Run Veracode Pipeline Scan
      - name: Run Veracode Pipeline Scan
        run: |
          java -jar veracode-cli/pipeline-scan.jar \
            -vid ${{ secrets.VERACODE_API_ID }} \
            -vkey ${{ secrets.VERACODE_API_KEY }} \
            -p "Verademo-Test" \
            -ds Testing \
            -f app.zip \
            -sf Verademo-Scan-Summary.txt \
            -jf Verademo-Scan-Report.json \
            -fjf filtered_results.json \
            -fs low
            
      # Generate a human-readable summary
      - name: Generate summary
        run: |
          if [ -s filtered_results.json ]; then
            jq -r '.issues // [] | .[] | "\(.severity) - \(.cweId) - \(.module) - \(.fileList // [] | join(","))"' filtered_results.json > Verademo-Scan-Summary.txt
          
            if [ ! -s Verademo-Scan-Summary.txt ]; then
              echo "No issues found" > Verademo-Scan-Summary.txt
            fi
          else
            echo "No issues found" > Verademo-Scan-Summary.txt
          fi


      
      # Upload JSON and summary
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: veracode-json-report
          path: results.json
      
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: veracode-summary-report
          path: Verademo-Scan-Summary.txt
