name: Veracode Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  veracode_scan:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Java (required for Veracode CLI)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Step 3: Install Veracode CLI
      - name: Install Veracode CLI
        run: |
          curl -L https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip -o pipeline-scan.zip
          unzip pipeline-scan.zip -d veracode-cli
          
      # Step 4: Package your application (zip all files)
      - name: Prepare Artifact
        run: zip -r app.zip .

      # Step 5: Run Veracode Pipeline Scan
      - name: Run Veracode Pipeline Scan
        run: |
          java -jar veracode-cli/pipeline-scan.jar \
            -vid ${{ secrets.VERACODE_API_ID }} \
            -vkey ${{ secrets.VERACODE_API_KEY }} \
            -p "Verademo-Test" \
            -ds Testing \
            -f app.zip \
            -sf Verademo-Scan-Summary.txt \
            -fs high
      
      # Step 6: Download PDF Report
      - name: Get JSON Scan Report
        run: |
          java -jar veracode-cli/pipeline-scan.jar \
            -vid ${{ secrets.VERACODE_API_ID }} \
            -vkey ${{ secrets.VERACODE_API_KEY }} \
            -p "Verademo-Test" \
            -ds Testing \
            -f app.zip \
            -jf Verademo-Scan-Report.json

      
      # Step 7: Upload PDF as Artifact in GitHub
      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: veracode-scan-report
          path: Verademo-Scan-Report.pdf
