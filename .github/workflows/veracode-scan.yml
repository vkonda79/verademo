name: Veracode Pipeline Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  veracode_scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Java (required for Veracode CLI)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Step 3: Install Veracode CLI
      - name: Install Veracode Pipeline Scan CLI
        run: |
          curl -L https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip -o pipeline-scan.zip
          unzip pipeline-scan.zip -d veracode-cli

      # Step 4: Prepare artifact (zip your project)
      - name: Prepare Artifact
        run: zip -r app.zip .

     # Step 5: Run Veracode scan (fail only on high severity)
      - name: Run Veracode Pipeline Scan
        run: |
          java -jar veracode-cli/pipeline-scan.jar \
            -vid ${{ secrets.VERACODE_API_ID }} \
            -vkey ${{ secrets.VERACODE_API_KEY }} \
            -p "Verademo-Test" \
            -ds Testing \
            -f app.zip \
            -sf ${{ github.workspace }}/Verademo-Scan-Summary.txt \
            -jf ${{ github.workspace }}/Verademo-Scan-Report.json \
            -fjf ${{ github.workspace }}/filtered_results.json \
            -fs high

      # Step 6: Upload JSON report
      - name: Upload JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: veracode-json-report
          path: Verademo-Scan-Report.json
          

     # Step 7: Upload Summary report
      - name: Upload Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: veracode-summary-report
          path: ${{ github.workspace }}/Verademo-Scan-Summary.txt

