name: Veracode SAST – Pipeline + PDF

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-scan:
    runs-on: ubuntu-latest

    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

          # Add repo workspace to PATH (where veracode is installed)
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      - name: Verify Veracode CLI
        run: |
           which veracode || true
           veracode --version


      - name: Package application
        run: |
          veracode package \
            --source . \
            --output veracode-artifact.zip
            --trust


      - name: Run Pipeline Scan
        run: |
          veracode pipeline scan \
            --file veracode-artifact.zip \
            --fail-on-severity High \
            --json_output pipeline-results.json

      - name: Upload Pipeline Results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifact
          path: |
            veracode-artifact.zip
            pipeline-results.json

  pdf-report:
    name: Sandbox Upload & PDF Report
    needs: pipeline-scan
    runs-on: ubuntu-latest

    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      APP_NAME: "Verademo-Test"
      SANDBOX_NAME: "CI-Sandbox"

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: pipeline-artifact

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          echo "$HOME/.veracode/bin" >> $GITHUB_PATH

      - name: Upload & Scan (Sandbox)
        run: |
          veracode uploadandscan \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --createprofile true \
            --createsandbox true \
            --filepath veracode-artifact.zip \
            --version "GitHub-${{ github.run_number }}" \
            --wait true

      - name: Generate PDF Report
        run: |
          mkdir -p reports
          veracode report create \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --format pdf \
            --output reports/Veracode-Sandbox-Scan.pdf

      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: Veracode-PDF-Report
          path: reports/Veracode-Sandbox-Scan.pdf
