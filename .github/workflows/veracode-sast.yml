name: Veracode Static Analysis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering

jobs:
  veracode-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          ./veracode version

      - name: Veracode Static Scan
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_SECRET }}
        run: |
          ./veracode static upload . \
            --app "Verademo-Test" \
            --sandbox "CI-Sandbox" \
            --create-profile true \
            --wait

      - name: Download PDF Report
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_SECRET }}
        run: |
          # This command fetches the latest build report for the specific app/sandbox
          ./veracode static get-report \
            --app "Verademo-Test" \
            --sandbox "CI-Sandbox" \
            --format pdf \
            --output report.pdf

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veracode-PDF-Report
          path: report.pdf
