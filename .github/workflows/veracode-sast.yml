name: Veracode Static Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest

    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_SECRET }}
      APP_NAME: "Verademo-Test"
      SANDBOX_NAME: "CI-Sandbox"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          echo "$HOME/.veracode/bin" >> $GITHUB_PATH

      - name: Package application
        run: |
          veracode package \
            --source . \
            --output veracode-artifact.zip

      - name: Upload and Scan (Sandbox)
        run: |
          veracode uploadandscan \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --createprofile true \
            --createsandbox true \
            --filepath veracode-artifact.zip \
            --version "GitHub-${{ github.run_number }}" \
            --wait true

      - name: Generate PDF Report
        run: |
          mkdir -p reports
          veracode report create \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --format pdf \
            --output reports/Veracode-Static-Scan.pdf

      - name: Upload PDF Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veracode-PDF-Report
          path: reports/Veracode-Static-Scan.pdf
