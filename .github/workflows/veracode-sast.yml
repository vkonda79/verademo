name: Veracode SAST – Upload & PDF

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  package-and-scan:
    runs-on: ubuntu-latest

    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      APP_NAME: "Verademo-Test"
      SANDBOX_NAME: "CI-Sandbox"

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Veracode CLI
      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      - name: Verify Veracode CLI
        run: |
          which veracode
          veracode --version

      # 3️⃣ Package the application (non-interactive)
      - name: Package application
        run: |
          veracode package \
            --source "$GITHUB_WORKSPACE" \
            --output veracode-artifact.zip \
            --trust \
            --verbose

      # 4️⃣ Upload and Scan to Sandbox
      - name: Upload & Scan (Sandbox)
        run: |
          veracode uploadandscan \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --createprofile true \
            --createsandbox true \
            --filepath veracode-artifact.zip \
            --version "GitHub-${{ github.run_number }}" \
            --wait true

      # 5️⃣ Generate PDF report
      - name: Generate PDF Report
        run: |
          mkdir -p reports
          veracode report create \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --format pdf \
            --output reports/Veracode-Sandbox-Scan.pdf

      # 6️⃣ Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifacts
          path: |
            veracode-artifact.zip
            reports/Veracode-Sandbox-Scan.pdf
