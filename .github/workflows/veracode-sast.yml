name: Veracode SAST

on:
  push:
    branches: [ "main" ]

jobs:
  veracode-cli-scan:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the latest code from your repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Download and install the Veracode CLI binary
      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          sudo mv ./veracode /usr/local/bin/

      # 3. Execute the scan using your stored secrets
      - name: Run SAST Scan
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_SECRET }}
        run: |
          # 1. Zip the current directory (excluding hidden git files)
          zip -r project.zip . -x "*.git*"
          
          # 2. Point the CLI to the zip file instead of the directory "."
          veracode static scan project.zip \
            --results-file veracode_results.json \
            --fail-on-severity="Very High, High"
          # 3. Use JQ to convert JSON to CSV
           # We extract: Module, Severity, CWE, and the Remediation Advice
          echo "Module,Severity,CWE_ID,Description,Remediation" > veracode_report.csv
          jq -r '.findings[] | [
            .files.source_file.file, 
            .severity, 
            .cwe_id, 
            (.display_text | gsub("\n"; " ") | gsub(","; ";")), 
            (.remediation_status // "Consult Veracode Platform for fix" | gsub("\n"; " ") | gsub(","; ";"))
          ] | @csv' veracode_results.json >> veracode_report.csv
      # 4. Save the results as a GitHub artifact for review
      - name: Archive Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veracode-report
          path: veracode_results.json
