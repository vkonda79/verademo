name: Veracode SAST – GitHub Action

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  veracode-scan:
    runs-on: ubuntu-latest

    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      APP_NAME: "Verademo-Test"
      SANDBOX_NAME: "CI-Sandbox"

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Package application
      - name: Package application
        run: |
          zip -r veracode-artifact.zip .

      # 3️⃣ Run Veracode Scan (uploadandscan + PDF)
      - name: Veracode Upload & Scan
        uses: veracode/veracode-cli-action@v1
        with:
          app_name: ${{ env.APP_NAME }}
          sandbox_name: ${{ env.SANDBOX_NAME }}
          filepath: veracode-artifact.zip
          version: GitHub-${{ github.run_number }}
          create_sandbox: true
          create_profile: true
          wait_for_scan: true
          report_format: pdf
          report_path: reports/Veracode-Sandbox-Scan.pdf

      # 4️⃣ Upload PDF and artifact
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifacts
          path: |
            veracode-artifact.zip
            reports/Veracode-Sandbox-Scan.pdf
