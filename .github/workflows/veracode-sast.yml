name: Veracode Static Scan + PDF

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
      APP_NAME: "Verademo-Test"
      SANDBOX_NAME: "CI-Sandbox"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Package app
      - name: Create ZIP artifact
        run: |
          zip -r veracode-artifact.zip .

      # Run Veracode Upload & Scan
      - name: Veracode Upload and Scan
        uses: veracode/veracode-uploadandscan-action@0.2.10
        with:
          appname: ${{ env.APP_NAME }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          filepath: veracode-artifact.zip
          createsandbox: "true"
          sandboxname: ${{ env.SANDBOX_NAME }}

      # Install CLI to generate PDF
      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      - name: Generate PDF
        run: |
          mkdir -p reports
          veracode report create \
            --appname "$APP_NAME" \
            --sandboxname "$SANDBOX_NAME" \
            --format pdf \
            --output reports/Veracode-SAST-Scan.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: veracode-pdf
          path: reports/Veracode-SAST-Scan.pdf
